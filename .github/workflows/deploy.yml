name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的默认分支是 master，请修改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # 你可以指定具体的 Flutter 版本，例如 '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        # 如果你的项目需要基准路径（比如仓库名不是根路径），可以在这里加上 --base-href
        # 例如仓库名为 my-flutter-app，则改为：flutter build web --release --base-href '/my-flutter-app/'
        run: flutter build web --release

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages